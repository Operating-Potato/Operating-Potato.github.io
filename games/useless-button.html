<!DOCTYPE html>
        
        <title>The Nothing Button</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="https://operating-potato.github.io/assets/favicon.png">
        <style>
            body, html {
                background-color: aliceblue;
                font-family: serif;
                width: 100%; height: 100%;
                margin: 0; padding: 0;
            }
            .wrapper {
                width: 100%; height: 100%;

            }
            .main {
                width: 100%; height: 100%;

                display: flex;
                flex-flow: column;
                justify-content: center;
                text-align: center;
                align-items: center;                
            }
            .footer {
                position: absolute;
                bottom: 0; left:0;
                margin: 10px;
            }
            #hehehe {
                color: white;
                background: linear-gradient(rgb(96, 94, 229), rgb(96, 130, 229));
                border: 2px outset rgb(96, 130, 229);
                padding: 5px;
                font-family: monospace;
            }
            button:hover {
                transform: scale(1.05);
            }
            button:active {
                transform: scale(0.95);
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="main">
                <h1>Button That Does Absolutely Nothing</h1>
                <button id="hehehe">click me</button>
            </div>
            <div class="footer">
                <a href="" download>Download this page!</a>
            </div>
        </div>
        
    

</body></html>
